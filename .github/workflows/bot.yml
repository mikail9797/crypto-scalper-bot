name: Crypto Scalper Bot

on:
  schedule:
    # Работает с 02:00 до 22:00 UTC = 05:00 до 01:00 МСК
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 2-21 * * *'
    # 22:00 UTC (01:00 МСК) — последний запуск
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run scalping bot
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      
      - name: Commit updated stats
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Scalper Bot"
          git add signal_stats.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update signal stats [skip ci]"
            git push
          fi
